name: CI · Supervisão

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      cenario:
        description: Cenário da verificação obrigatória
        type: choice
        required: true
        default: normal
        options:
          - normal
          - falha

permissions:
  contents: read

jobs:
  verificar:
    name: Supervisão · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verificar supervisao
        env:
          LAB_CENARIO: ${{ inputs.cenario || 'normal' }}
        run: python tools/verify_service.py --project-path services/supervisao --test-path verificacoes
      - name: Registrar o resultado
        if: ${{ always() }}
        run: |
          if [ -f outputs/supervisao/validacao.json ]; then
            cat outputs/supervisao/validacao.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório indisponível; examine os passos anteriores." >> "$GITHUB_STEP_SUMMARY"
          fi
